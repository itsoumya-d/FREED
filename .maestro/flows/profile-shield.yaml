appId: app.freed.recovery
name: profile-shield
tags:
  - smoke
  - read-only
---
# Requires a disposable isolated fixture; no state or Keychain reset.
- openLink: "freed:///profile"
- runFlow:
    when:
      visible: "Open in.*FREED.*"
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible:
      id: "screen-main-profile"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "Open Protect"
    direction: DOWN
    timeout: 10000
- tapOn: "Open Protect"
- assertVisible:
    id: "screen-main-shield"
- takeScreenshot: "profile-shield"
