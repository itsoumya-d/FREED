appId: app.freed.recovery
name: platform-limits
tags:
  - smoke
  - read-only
---
# Requires an English disposable fixture; no state or Keychain reset.
# Each assertion targets its current native detail page; this is UI smoke, not enforcement proof.
- openLink: "freed:///shield/dns"
- runFlow:
    when:
      visible: "Open in.*FREED.*"
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible: { id: "screen-main-shield-dns" }
    timeout: 15000
- assertVisible: "Protection health"
- openLink: "freed:///shield/websites"
- extendedWaitUntil:
    visible: { id: "screen-main-shield-websites" }
    timeout: 15000
- assertVisible: "Web safety"
- openLink: "freed:///shield/diagnostics"
- extendedWaitUntil:
    visible: { id: "screen-main-shield-diagnostics" }
    timeout: 15000
- scrollUntilVisible:
    element: { text: "Show advanced diagnostics" }
    direction: DOWN
    timeout: 10000
- tapOn: "Show advanced diagnostics"
- assertVisible: "Advanced diagnostics"
- assertVisible: { id: "screen-main-shield-diagnostics" }
- takeScreenshot: "platform-limits"
