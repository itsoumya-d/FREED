appId: app.freed.recovery
name: paywall-legal
tags:
  - smoke
  - read-only
---
# Requires a disposable isolated fixture; no state or Keychain reset.
- openLink: "freed:///flow/paywall"
- runFlow:
    when:
      visible: "Open in.*FREED.*"
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible:
      id: "screen-paywall"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "Privacy Policy|Privacy"
    direction: DOWN
    timeout: 10000
- assertVisible: "Privacy Policy|Privacy"
- assertVisible: "Terms.*"
- scrollUntilVisible:
    element:
      text: "Continue with Free"
    direction: DOWN
    timeout: 10000
- assertVisible: "Continue with Free"
- takeScreenshot: "paywall-legal"
