appId: app.freed.recovery
name: slip-save
tags:
  - smoke
  - local-write
---
# Requires a disposable isolated fixture; no state or Keychain reset.
- openLink: "freed:///flow/slip"
- runFlow:
    when:
      visible: "Open in.*FREED.*"
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible:
      id: "screen-slip"
    timeout: 15000
- assertVisible: "Reset Moment"
- tapOn: "Stress"
- scrollUntilVisible:
    element:
      id: "slip-note"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "slip-note"
- inputText: "Disposable fixture private note"
- hideKeyboard
- scrollUntilVisible:
    element:
      text: "Save and Start Again"
    direction: DOWN
    timeout: 10000
- tapOn: "Save and Start Again"
- assertVisible:
    id: "screen-main-today"
- takeScreenshot: "slip-save"
