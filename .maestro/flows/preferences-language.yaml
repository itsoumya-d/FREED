appId: app.freed.recovery
name: preferences-language
tags:
  - smoke
  - local-write
---
# Unexecuted smoke scenario. Requires an isolated disposable English/LTR fixture.
# Full scenario and physical-device receipts remain separate obligations.
- openLink: "freed:///preferences"
- runFlow:
    when:
      visible: "Open in.*FREED.*"
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible:
      id: "screen-preferences"
    timeout: 15000
# Both platforms expose accessible radio rows. Full locale and OS-dialog reviews remain separate.
- scrollUntilVisible:
    element: { id: "language-en" }
    direction: DOWN
    timeout: 10000
- tapOn: { id: "language-en" }
- assertVisible: { id: "language-en", checked: true }
- scrollUntilVisible:
    element: { id: "language-hi" }
    direction: DOWN
    timeout: 10000
- tapOn: { id: "language-hi" }
- assertVisible: { id: "language-hi", checked: true }
- scrollUntilVisible:
    element: { id: "language-es" }
