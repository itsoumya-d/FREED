appId: app.freed.recovery
name: intercept
tags:
  - smoke
  - local-write
---
# Requires a disposable isolated fixture; no state or Keychain reset.
- openLink: "freed:///today"
- runFlow:
    when:
      visible: "Open in.*FREED.*"
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible:
      id: "screen-main-today"
    timeout: 15000
- scrollUntilVisible:
    element: { id: "home-help-now" }
    direction: DOWN
    timeout: 10000
- tapOn: { id: "home-help-now" }
- assertVisible:
    id: "screen-intercept"
- scrollUntilVisible:
    element: { text: "Back to Safety" }
    direction: DOWN
    timeout: 10000
- assertVisible: "Back to Safety"
- assertVisible: "Surf the Urge.*|Continue to Reset"
- tapOn: "Back to Safety"
- assertVisible:
    id: "screen-main-today"
- takeScreenshot: "intercept"
