appId: app.freed.recovery
name: deletion-local
tags:
  - smoke
  - read-only
---
# Requires a disposable isolated fixture; no state or Keychain reset.
- openLink: "freed:///profile"
- runFlow:
    when:
      visible: "Open in.*FREED.*"
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible:
      id: "screen-main-profile"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "Privacy & support"
    direction: DOWN
    timeout: 10000
- tapOn: "Privacy & support"
- scrollUntilVisible:
    element:
      text: "Delete Local Data"
    direction: DOWN
    timeout: 10000
- tapOn: "Delete Local Data"
- assertVisible: "Confirm Delete"
- assertVisible:
    id: "screen-main-profile"
- takeScreenshot: "deletion-local"
