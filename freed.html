<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FREED — Freedom Recovery & Empowerment Every Day</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<link rel="stylesheet" href="freed-v2/tokens.css">
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#0D0B1A; }
  #root { width:100%; height:100%; display:flex; align-items:center; justify-content:center; }

  /* Sound bar animation */
  @keyframes soundBar1 { from{height:4px} to{height:10px} }
  @keyframes soundBar2 { from{height:6px} to{height:14px} }
  @keyframes soundBar3 { from{height:8px} to{height:12px} }
  @keyframes soundBar4 { from{height:4px} to{height:8px} }

  /* Scroll snap feel */
  .snap-scroll { scroll-snap-type: y mandatory; }
  .snap-scroll > * { scroll-snap-align: start; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="freed-v2/screens-onboarding.jsx"></script>
<script type="text/babel" src="freed-v2/screens-home.jsx"></script>
<script type="text/babel" src="freed-v2/screens-main.jsx"></script>

<script type="text/babel">

// ── BOTTOM NAV — Floating pill · Reference design language ───────────────────
function BottomNav({ active, onChange, onPanic }) {
  const NAV_PURPLE = '#B898FF';

  const tabs = [
    { id: 'home', icon: (a) => (
      <svg width="21" height="21" viewBox="0 0 24 24"
           fill={a ? NAV_PURPLE : 'none'}
           stroke={a ? NAV_PURPLE : 'rgba(240,236,248,0.38)'} strokeWidth="2" strokeLinecap="round">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
    )},
    { id: 'analytics', icon: (a) => (
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none"
           stroke={a ? NAV_PURPLE : 'rgba(240,236,248,0.38)'} strokeWidth="2" strokeLinecap="round">
        <line x1="18" y1="20" x2="18" y2="10"/>
        <line x1="12" y1="20" x2="12" y2="4"/>
        <line x1="6"  y1="20" x2="6"  y2="14"/>
      </svg>
    )},
    { id: 'library', icon: (a) => (
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none"
           stroke={a ? NAV_PURPLE : 'rgba(240,236,248,0.38)'} strokeWidth="2" strokeLinecap="round">
        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
      </svg>
    )},
    { id: 'community', icon: (a) => (
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none"
           stroke={a ? NAV_PURPLE : 'rgba(240,236,248,0.38)'} strokeWidth="2" strokeLinecap="round">
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
        <circle cx="9" cy="7" r="4"/>
        <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
        <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
      </svg>
    )},
    { id: 'profile', icon: (a) => (
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none"
           stroke={a ? NAV_PURPLE : 'rgba(240,236,248,0.38)'} strokeWidth="2" strokeLinecap="round">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
        <circle cx="12" cy="7" r="4"/>
      </svg>
    )},
  ];

  return (
    <div style={{
      position: 'absolute', bottom: 14, left: 12, right: 12,
      height: 72, display: 'flex', alignItems: 'center', gap: 10,
      zIndex: 200,
    }}>
      {/* Main tab pill */}
      <div style={{
        flex: 1, height: 72, borderRadius: 36,
        background: '#1E1C2E',
        border: '1.5px solid rgba(255,255,255,0.1)',
        boxShadow: '0 8px 40px rgba(0,0,0,0.55), 0 2px 8px rgba(0,0,0,0.3)',
        display: 'flex', alignItems: 'center',
        padding: '0 6px',
      }}>
        {tabs.map(tab => {
          const isActive = active === tab.id;
          return (
            <button key={tab.id} onClick={() => onChange(tab.id)} style={{
              flex: 1, height: 58, borderRadius: 29,
              background: isActive ? 'rgba(184,152,255,0.2)' : 'transparent',
              border: 'none', cursor: 'pointer',
              display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center',
              gap: 4, transition: 'all 250ms cubic-bezier(0.34,1.56,0.64,1)',
              transform: isActive ? 'scale(1.06)' : 'scale(1)',
            }}>
              {tab.icon(isActive)}
              {isActive && (
                <div style={{ width: 4, height: 4, borderRadius: '50%', background: NAV_PURPLE }} />
              )}
            </button>
          );
        })}
      </div>

      {/* Panic FAB */}
      <button onClick={onPanic} style={{
        width: 66, height: 66, borderRadius: 33, flexShrink: 0,
        background: 'linear-gradient(135deg, #B898FF 0%, #FF85A8 100%)',
        border: 'none', cursor: 'pointer',
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        boxShadow: '0 4px 28px rgba(184,152,255,0.6)',
        transition: 'transform 150ms cubic-bezier(0.34,1.56,0.64,1)',
      }}
        onPointerDown={e => e.currentTarget.style.transform = 'scale(0.91)'}
        onPointerUp={e => e.currentTarget.style.transform = 'scale(1)'}
        onPointerLeave={e => e.currentTarget.style.transform = 'scale(1)'}
      >
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2.5" strokeLinecap="round">
          <path d="M12 5v14M5 12h14"/>
        </svg>
      </button>
    </div>
  );
}

// ── QUIZ DATA ─────────────────────────────────────────────────────────────────
const QUIZ_STEPS = [
  {
    question: "What is your gender?",
    options: [
      { value: 'male',   label: 'Male',   icon: '♂️' },
      { value: 'female', label: 'Female', icon: '♀️' },
      { value: 'other',  label: 'Other / Prefer not to say', icon: '✦' },
    ],
  },
  {
    question: "How long have you struggled with this?",
    options: [
      { value: 'lt1',  label: 'Less than 1 year' },
      { value: '1to5', label: '1 to 5 years' },
      { value: '5to10',label: '5 to 10 years' },
      { value: 'gt10', label: 'More than 10 years' },
    ],
  },
  {
    question: "How often does it happen?",
    options: [
      { value: 'daily',  label: 'Daily' },
      { value: 'weekly', label: 'A few times a week' },
      { value: 'monthly',label: 'Weekly or less' },
      { value: 'rarely', label: 'Rarely / Used to' },
    ],
  },
  {
    question: "Which symptoms do you experience? (Select all that apply)",
    multi: true,
    options: [
      { value: 'unmotivated',  label: 'Feeling unmotivated', icon: '😔' },
      { value: 'foggy',        label: 'Brain fog / Poor memory', icon: '🌫️' },
      { value: 'anxiety',      label: 'Anxiety or social withdrawal', icon: '😰' },
      { value: 'performance',  label: 'Performance anxiety', icon: '⚡' },
      { value: 'confidence',   label: 'Low self-confidence', icon: '📉' },
      { value: 'concentration',label: 'Difficulty concentrating', icon: '🎯' },
    ],
  },
  {
    question: "What's your main reason for quitting?",
    options: [
      { value: 'confidence', label: 'Build confidence & self-worth', icon: '💪' },
      { value: 'clarity',    label: 'Get mental clarity back', icon: '🧠' },
      { value: 'relationship',label: 'Improve my relationships', icon: '💚' },
      { value: 'spiritual',  label: 'Spiritual / personal growth', icon: '✨' },
      { value: 'health',     label: 'Overall health & energy', icon: '⚡' },
    ],
  },
  {
    question: "Have you tried to quit before?",
    options: [
      { value: 'never',   label: "No, this is my first time" },
      { value: 'few',     label: "Yes, a few times" },
      { value: 'many',    label: "Yes, many times" },
    ],
  },
];

// ── MAIN APP ──────────────────────────────────────────────────────────────────
function App() {
  const [screen, setScreen]     = React.useState('splash');
  const [subScreen, setSubScreen] = React.useState(null); // overlays
  const [tab, setTab]           = React.useState('home');
  const [quizStep, setQuizStep] = React.useState(0);
  const [quizData, setQuizData] = React.useState({});
  const [streak]                = React.useState(5);
  const [animKey, setAnimKey]   = React.useState(0);
  const [prevScreen, setPrevScreen] = React.useState(null);

  const goTo = (s, sub = null) => {
    setPrevScreen(screen);
    setAnimKey(k => k + 1);
    setScreen(s);
    setSubScreen(sub);
  };

  const goBack = () => {
    if (prevScreen) goTo(prevScreen);
  };

  // Render content based on state
  const renderContent = () => {

    // ── SPLASH ──
    if (screen === 'splash') {
      return <SplashScreen onDone={() => goTo('welcome')} />;
    }

    // ── WELCOME ──
    if (screen === 'welcome') {
      return (
        <WelcomeScreen
          onStartQuiz={() => goTo('quiz')}
          onLogin={() => goTo('login')}
        />
      );
    }

    // ── LOGIN ──
    if (screen === 'login') {
      return (
        <SignUpScreen
          onApple={() => goTo('main')}
          onGoogle={() => goTo('main')}
          onEmail={() => goTo('email')}
          onBack={() => goTo('welcome')}
        />
      );
    }

    // ── EMAIL ──
    if (screen === 'email') {
      return (
        <EmailScreen
          onBack={() => goTo('login')}
          onContinue={() => goTo('main')}
        />
      );
    }

    // ── QUIZ ──
    if (screen === 'quiz') {
      // Insight screens between quiz sections
      if (quizStep === 0) {
        return (
          <InsightScreen
            icon="🧠"
            title="We can help you break free"
            body="FREED uses science-backed methods to help you rewire your brain and reclaim your life."
            bullets={[
              { icon: '⚡', bold: 'Identity-first recovery', text: '— become who you want to be', color: 'rgba(108,99,255,0.2)' },
              { icon: '🛡️', bold: 'Real-time content blocking', text: '— stops temptation at the source', color: 'rgba(0,217,165,0.2)' },
              { icon: '💪', bold: 'Physical challenge system', text: '— redirects cravings instantly', color: 'rgba(255,112,67,0.2)' },
            ]}
            cta="Start Assessment"
            onNext={() => setQuizStep(1)}
          />
        );
      }

      // After all questions → goals screen
      if (quizStep > QUIZ_STEPS.length) {
        return (
          <InsightScreen
            icon="🌱"
            title="Your recovery plan is ready"
            body="Based on your answers, we've built a personalized program for your journey."
            bullets={[
              { icon: '📊', bold: 'Brain Rewiring Tracker', text: '— see real progress daily', color: 'rgba(108,99,255,0.2)' },
              { icon: '🎯', bold: 'Custom challenge library', text: '— matched to your needs', color: 'rgba(0,217,165,0.2)' },
              { icon: '🤖', bold: 'CLARA AI companion', text: '— available 24/7', color: 'rgba(255,112,67,0.2)' },
            ]}
            cta="Create My Account"
            onNext={() => goTo('signup')}
          />
        );
      }

      const step = QUIZ_STEPS[quizStep - 1];
      return (
        <QuizScreen
          key={quizStep}
          question={step.question}
          step={quizStep}
          total={QUIZ_STEPS.length}
          options={step.options}
          multi={step.multi || false}
          onAnswer={val => {
            setQuizData(d => ({ ...d, [quizStep]: val }));
            setQuizStep(s => s + 1);
          }}
          onBack={() => setQuizStep(s => Math.max(0, s - 1))}
          onSkip={() => setQuizStep(s => s + 1)}
        />
      );
    }

    // ── SIGN UP ──
    if (screen === 'signup') {
      return (
        <SignUpScreen
          onApple={() => goTo('paywall')}
          onGoogle={() => goTo('paywall')}
          onEmail={() => goTo('emailsignup')}
          onBack={() => goTo('quiz')}
        />
      );
    }

    // ── EMAIL SIGNUP ──
    if (screen === 'emailsignup') {
      return (
        <EmailScreen
          onBack={() => goTo('signup')}
          onContinue={() => goTo('paywall')}
        />
      );
    }

    // ── PAYWALL ──
    if (screen === 'paywall') {
      return (
        <PaywallScreen
          onSubscribe={() => goTo('main')}
          onRestore={() => goTo('main')}
          onClose={() => goTo('main')}
        />
      );
    }

    // ── SUB-SCREENS (overlays over main) ──
    if (screen === 'panic') {
      return (
        <PanicScreen
          onThinking={() => goTo('challenge')}
          onRelapsed={() => goTo('main')}
          onClose={() => goTo('main')}
        />
      );
    }

    if (screen === 'challenge') {
      return (
        <ChallengeScreen
          onComplete={() => goTo('main')}
          onBack={() => goTo('panic')}
        />
      );
    }

    if (screen === 'breathing') {
      return (
        <BreathingScreen onBack={() => goTo('main')} />
      );
    }

    if (screen === 'clara') {
      return (
        <ClaraScreen onBack={() => goTo('main')} />
      );
    }

    if (screen === 'progresscard') {
      return (
        <ProgressCardScreen streak={streak} onBack={() => goTo('main')} />
      );
    }

    // ── MAIN APP ──
    if (screen === 'main') {
      return (
        <div style={{ position: 'absolute', inset: 0 }}>
          {/* Tab content */}
          <div key={tab} style={{ position: 'absolute', inset: 0, animation: 'fadeIn 0.2s both' }}>
            {tab === 'home' && (
              <HomeScreen
                streak={streak}
                onPanic={() => goTo('panic')}
                onTabChange={setTab}
              />
            )}
            {tab === 'analytics' && <AnalyticsScreen streak={streak} />}
            {tab === 'library' && (
              <LibraryScreen
                onCLARA={() => goTo('clara')}
                onBreathe={() => goTo('breathing')}
              />
            )}
            {tab === 'community' && <CommunityScreen />}
            {tab === 'profile' && (
              <ProfileScreen
                streak={streak}
                onCard={() => goTo('progresscard')}
              />
            )}
          </div>

          {/* Bottom nav */}
          <BottomNav active={tab} onChange={setTab} onPanic={() => goTo('panic')} />
        </div>
      );
    }

    return null;
  };

  return (
    <div style={{
      width: '100%', height: '100%',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      background: '#0D0B1A',
    }}>
      {/* iPhone frame */}
      <div style={{
        width: 390,
        height: 844,
        borderRadius: 50,
        background: '#1B1929',
        overflow: 'hidden',
        position: 'relative',
        boxShadow: '0 0 0 2px #2D2A44, 0 0 0 5px #1B1929, 0 40px 100px rgba(0,0,0,0.85)',
        border: '1px solid rgba(255,255,255,0.08)',
      }}>
        {/* iOS Status bar */}
        <div style={{
          position: 'absolute', top: 0, left: 0, right: 0, height: 44,
          display: 'flex', alignItems: 'center', justifyContent: 'space-between',
          padding: '0 24px',
          zIndex: 9999,
          pointerEvents: 'none',
        }}>
          <span style={{
            fontFamily: "'SF Pro Display', -apple-system, sans-serif",
            fontSize: 15, fontWeight: 700, color: '#fff',
          }}>
            9:41
          </span>
          {/* Dynamic island */}
          <div style={{
            width: 120, height: 30,
            background: '#000', borderRadius: 20,
            position: 'absolute', left: '50%', transform: 'translateX(-50%)',
            top: 8,
          }} />
          <div style={{ display: 'flex', gap: 6, alignItems: 'center' }}>
            {/* Signal bars */}
            <svg width="17" height="12" viewBox="0 0 17 12">
              {[2,5,8,11].map((x,i) => (
                <rect key={i} x={x} y={12-(i+1)*3} width="3" height={(i+1)*3} rx="1"
                  fill={i < 3 ? '#fff' : 'rgba(255,255,255,0.3)'} />
              ))}
            </svg>
            {/* WiFi */}
            <svg width="16" height="12" viewBox="0 0 16 12">
              <path d="M8 10.5a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3z" fill="#fff"/>
              <path d="M3.5 7.5C5 6 6.4 5.25 8 5.25s3 .75 4.5 2.25" stroke="#fff" strokeWidth="1.5" fill="none" strokeLinecap="round"/>
              <path d="M1 5C3.2 2.8 5.5 1.5 8 1.5s4.8 1.3 7 3.5" stroke="#fff" strokeWidth="1.5" fill="none" strokeLinecap="round"/>
            </svg>
            {/* Battery */}
            <div style={{ display: 'flex', alignItems: 'center', gap: 1 }}>
              <div style={{
                width: 22, height: 11, borderRadius: 3,
                border: '1.5px solid rgba(255,255,255,0.7)',
                padding: '1.5px',
                display: 'flex', alignItems: 'center',
              }}>
                <div style={{
                  width: '80%', height: '100%',
                  background: '#fff', borderRadius: 1,
                }} />
              </div>
              <div style={{ width: 2, height: 4, background: 'rgba(255,255,255,0.5)', borderRadius: 1 }} />
            </div>
          </div>
        </div>

        {/* Home indicator */}
        <div style={{
          position: 'absolute', bottom: 8, left: '50%', transform: 'translateX(-50%)',
          width: 130, height: 5, borderRadius: 3,
          background: 'rgba(255,255,255,0.3)',
          zIndex: 9999, pointerEvents: 'none',
        }} />

        {/* Screen content with top padding for status bar */}
        <div style={{
          position: 'absolute', inset: 0,
          paddingTop: 44,
          display: 'flex', flexDirection: 'column',
        }}>
          <div style={{ flex: 1, position: 'relative', overflow: 'hidden' }} key={animKey}>
            {renderContent()}
          </div>
        </div>
      </div>

      {/* Outside navigation hint */}
      {screen === 'main' && (
        <div style={{
          position: 'absolute', bottom: 32,
          display: 'flex', gap: 12, alignItems: 'center',
        }}>
          <div style={{
            padding: '8px 20px', borderRadius: 20,
            background: 'rgba(255,255,255,0.06)', border: '1px solid rgba(255,255,255,0.1)',
            fontSize: 12, color: 'rgba(255,255,255,0.4)', fontFamily: "'Inter',sans-serif",
          }}>
            FREED — Interactive Prototype
          </div>
        </div>
      )}

      {/* Onboarding progress indicator outside frame */}
      {['quiz', 'signup', 'emailsignup'].includes(screen) && (
        <div style={{
          position: 'absolute', top: 20,
          display: 'flex', gap: 8, alignItems: 'center',
        }}>
          {['welcome','quiz','signup','paywall','main'].map((s, i) => (
            <div key={s} style={{
              width: ['welcome','quiz','signup','paywall','main'].indexOf(screen) >= i ? 20 : 6,
              height: 6, borderRadius: 3,
              background: ['welcome','quiz','signup','paywall','main'].indexOf(screen) >= i
                ? '#6C63FF' : 'rgba(255,255,255,0.15)',
              transition: 'all 400ms cubic-bezier(0.4,0,0.2,1)',
            }} />
          ))}
        </div>
      )}
    </div>
  );
}

// ── MOUNT ─────────────────────────────────────────────────────────────────────
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
