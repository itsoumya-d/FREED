penedAt unchanged then still counting forward to 40; a legacy payload with the pre-fix streakDays: 99 hydrating unchanged (check-in record intact) and healing to 101 on next open with XP rising by exactly 12*2+4*2; the two T005 backlog rows (7-day analytics window yields 7 unique buckets 2026-10-29..2026-11-04 with the reset on index 3, daysSinceLastRelapse 3, currentStreakDays 307; Sydney 2026-10-01..2026-10-07; summarizeCheckIns total stays 7); milestone 30 fires and 29 targets 30. Negative control proves the guard bites: reverting the helper to the old fixed-ms formula makes the suite fail with 99 !== 100 under TZ=America/New_York and -101 !== -100 under TZ=Australia/Sydney, exactly T005's predicted rows; the suite then passed again. Allowed-files compliance: only the four permitted files were written, freed-app.tsx display code untouched, no ANALYTICS_SCHEMA_VERSION or payload-shape change, no new dependency."
