# GoalBuddy v2 state.yaml
# Board truth lives here. goal.md is the editable charter; notes/ holds long receipts only.

version: 2

goal:
  title: "FREED full feature audit and production completion"
  slug: "feature-audit-completion"
  kind: existing_plan # specific | open_ended | existing_plan | recovery | audit
  tranche: "Continuous execution: finish discovery (validated feature inventory PLUS per-value data-accuracy verdict table PLUS native-capability requirement matrix PLUS per-platform Android/iOS verdicts from observed user-end behavior), then complete successive safe verified Worker slices until every feature is working with full UI-state + motion coverage, every derived value is provably accurate at time/clock/persistence boundaries, every platform-specific defect is fixed or explicitly blocked-with-receipt, test-ad markers are in place, and the deliverables exist."
  status: active # active | blocked | done
  oracle:
    signal: "Green per-platform verification (commands discovered in T002) + feature inventory where every row is 'working' with empty/loading/error/success + motion evidence, or 'blocked' with a receipt naming the missing requirement; every ad surface has a test/mock unit plus a findable TODO(AD-SDK) marker; AND every user-visible derived value (streaks, counters, totals, timers, usage minutes, levels, percentages) has a deterministic time-frozen test proving it correct across midnight, timezone change, DST, clock change, reboot, reinstall and second device; AND every feature carries an explicit Android and iOS verdict where unproven is admissible only with a receipt naming the missing device."
    cadence: "after each Worker package and at final audit"
    final_proof: "Final Judge receipt mapping all done-task receipts to the original outcome, including the feature-inventory checklist deliverable, fix summary, test-ad placeholder confirmation, the per-value data-accuracy verdict table, the native-capability requirement matrix, and the per-platform Android/iOS verdict list with any unproven row justified by a device-availability receipt."
    dimensions:
      - "D1 verification-green: discovered typecheck/test suites pass on each Worker slice"
      - "D2 feature-completeness: inventory row working with all four UI states + motion"
      - "D3 data-accuracy: each derived value traced to one source of truth and frozen-time tested at boundaries"
      - "D4 native-capability: declared permission/API/OS-floor requirement plus degradation path per capability"
      - "D5 per-platform-verdict: Android and iOS each working/broken/degraded/unproven with evidence"
      - "D6 saved-data-safety: pre-change persisted payload still loads with unchanged values"
      - "D7 ad-placeholder: test/mock unit plus TODO(AD-SDK) marker on every ad surface"
  intake:
    original_request: "Complete audit of the codebase; bring every existing feature to 100% functional production quality (UI, interactions, motion). No real ad integration — use test/mock ad units. Deliver inventory checklist, fix summary, and test-ad confirmation."
    interpreted_outcome: "Every existing FREED feature works end-to-end on both platforms with complete UI states, polished design-system-consistent motion, and marked mock/test ad surfaces."
    input_shape: existing_plan # vague | specific | existing_plan | recovery | audit
    audience: "Consumer app users; owner wants best-in-category consumer polish"
    authority: requested # requested | approved | inferred | needs_approval | blocked
    proof_type: test # test | demo | artifact | metric | review | source_backed_answer | decision
    completion_proof: "Feature inventory checklist fully resolved (working or blocked-with-receipt), per-platform verification green, TODO(AD-SDK) markers confirmed on every ad surface, PLUS a per-value data-accuracy table where every user-visible derived value is covered by a passing frozen-time boundary test, PLUS per-platform Android/iOS verdicts with native-capability requirements and degradation paths, PLUS persisted-payload migration tests green, and final audit maps receipts to outcome."
    likely_misfire: "Audit-only stop without fixes; reporting on data accuracy instead of fixing it; inventing net-new features instead of completing existing ones; integrating a real ad SDK; fixing one platform while regressing the other; marking stubs done without state/motion coverage; calling a streak 'accurate for all users' from a happy-path screenshot; treating a plausible on-screen number as proof the derivation is correct; refactoring persistence and silently losing users' saved streaks or history."
    blind_spots_considered:
      - "Expo/React Native app with native ios/ + android/ folders — parity means shared TS layer plus native modules behaving identically on both platforms."
      - "Verification tooling unknown until mapped (tests/ exists; scripts in package.json and scripts/)."
      - "'100% functional' unbounded until inventory exists — tranche bounds it via successive slices."
      - "Existing goal docs/goals/android-setup-activation-recovery may overlap — check before scheduling conflicting slices."
      - "Ad-surface locations unknown until discovery (stubs, mocks, or absent)."
      - "Device clock is user-controllable: accuracy needs an explicit trust model (wall clock vs monotonic anchor vs persisted anchor) per derived value, and none exists yet."
      - "T001 found one ~9241-line src/features/freed-app.tsx state machine — a single source of truth for streaks/counters may not exist, so the same value can be derived differently in several places."
      - "Canonical backend is still ambiguous (Vercel routes vs Firebase Functions); whether a stat is device-local or server-derived changes what 'accurate for all users' and multi-device behavior mean."
      - "Android and iOS are not OS-symmetric (usage-stats/DNS/VPN filtering, notification grant, overlays vs Device Activity/Screen Time extensions, App-Bound Domains); some features may be impossible or policy-blocked on one platform, which must be reported as a verdict plus product decision rather than faked parity."
      - "A booted iOS simulator or physical device may be unreachable here, so iOS-only native claims may land as blocked-with-receipt instead of verified."
      - "The worktree is dirty; current behavior must be read from the working tree rather than HEAD."
    existing_plan_facts:
      - "Phase 1 DISCOVERY first: walk entire codebase incl. native layers; document intended behavior, UI presentation, interaction paths, all UI states, animation/motion behavior, end-to-end wiring status; produce feature inventory BEFORE touching code."
      - "Phase 2 GAP ANALYSIS: missing/broken/half-implemented/inconsistent work; cross-platform parity gaps; UI/UX and motion inconsistencies; flag placeholders/mocks/TODOs."
      - "Phase 3 FIX & COMPLETE: every interaction works; all four UI states handled; animations smooth and consistent with design system; cross-platform parity."
      - "EXCLUDE real ad network integration; ad surfaces use realistic test/mock units with clear marker/TODO for release-time SDK swap-in."
      - "Deliverables: feature inventory checklist; broken/missing vs fixed summary; test-ad placeholder confirmation with markers."
      - "Quality bar: best in category for a consumer app."
      - "2026-09-26 reaffirmation: research every mobile feature deeply (code purpose, native capabilities needed, intended functionality), determine whether displayed data (streaks and all stats/counters) is accurate for ALL users, determine which features do not work on Android and which do not work on iOS, determine how each feature behaves on the user end in practice, then FIX the accuracy and functional problems found and close every gap that blocks 100% readiness."
      - "2026-09-26 intake answer: this board is the single owner of this work — do not open a competing board over the same files."
      - "2026-09-26 intake answer: proof gate is deterministic time-frozen tests for every derived value, plus real adb/emulator/simulator evidence for native-only behavior, degrading to blocked-with-receipt when no device is reachable."
      - "2026-09-26 intake answer: blast radius is full (TS/state layer, persistence and derivation layer incl. storage-schema migration, modules/, ios/, android/, functions/) but only inside a Judge-specced slice gated by tests plus an existing-saved-data-still-loads test."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  data_claims_require_frozen_time_test: true
  native_claims_require_device_evidence: true
  persistence_change_requires_backcompat_test: true
  per_platform_verdict_required: true
  single_board_owns_these_files: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  # installed | bundled_not_installed | missing | unknown
  scout: installed # verified ~/.claude/agents/goal-scout.md + ~/.codex/agents/goal_scout.toml
  worker: installed # verified ~/.claude/agents/goal-worker.md + ~/.codex/agents/goal_worker.toml
  judge: installed # verified ~/.claude/agents/goal-judge.md + ~/.codex/agents/goal_judge.toml

visual_board:
  # none | local | unknown
  selected: local
  local:
    status: live
    url: "http://goalbuddy.localhost:41737/feature-audit-completion/"
    command: "node ~/.claude/skills/goal-prep/surfaces/local-goal-board/scripts/local-goal-board.mjs --goal docs/goals/feature-audit-completion"

active_task: T003

tasks:
  - id: T001
    type: scout
    assignee: Scout
    status: done
    reasoning_hint: default # default | low | medium | high | xhigh
    objective: "Walk the entire codebase (app/, src/, store/, modules/, functions/, ios/, android/, design/, tests/) and produce the Phase-1 feature inventory: for every feature — intended behavior, screens/components/flows, interaction paths, UI states (empty/loading/error/success), animation/motion behavior, end-to-end wiring status (working/partially working/broken/stubbed/missing), and any placeholder/mock/TODO flags including ad surfaces."
    inputs:
      - app/
      - src/
      - store/
      - modules/
      - functions/
      - ios/
      - android/
      - design/
      - tests/
      - docs/
      - package.json
    constraints:
      - "Read-only. Do not edit implementation files."
      - "Inventory BEFORE any code changes (user's Phase 1 gate)."
      - "Prefer concrete file-path evidence per feature row over generic claims."
      - "Explicitly locate every current/future ad surface."
      - "Note overlap risk with existing goal docs/goals/android-setup-activation-recovery/."
    expected_output:
      - "Feature inventory table: name, files, intended behavior, UI presentation, interaction paths, states coverage, motion, wiring status"
      - "Placeholder/mock/TODO/ad-surface flags"
      - "Cross-platform parity observations (iOS vs Android)"
      - "Candidate gap-analysis findings for Phase 2"
      - "Candidate next tasks"
    receipt:
      result: done
      note: notes/T001-feature-inventory.md
      summary: "Walked app/, src/, store/, modules/, functions/, ios/, android/, design/, tests/, docs/. Whole UI lives in one 9,241-line freed-app.tsx state machine (17 screens) behind a minimal expo-router shell. Inventoried 58 features across 20 domains: 24 working (local), 22 partially working (production env/evidence gaps), 3 broken/dead paths, 4 stubbed (community intentionally fail-closed), 5 missing/dead. Exactly ONE ad surface exists (rewarded reset ad); no banners/interstitials/native ads. Ad-marker contract mismatch vs goal charter. Heavy overlap with android-setup-activation-recovery goal on ProtectionSetupScreen — flagged for coordination."
      evidence:
        - src/features/freed-app.tsx
        - src/lib/monetization.ts
        - app.config.js
        - modules/freed-protection/
        - functions/src/index.ts
        - docs/completion-audit.md
        - docs/release-blockers.md
        - notes/T001-feature-inventory.md
      spawned_tasks: []
      ambiguities_for_judge:
        - "Which backend (Vercel routes vs Firebase Functions) is canonical per environment for purchases/analytics/AI"
        - "Whether react-native-purchases fallback must be kept or dropped given expo-iap is preferred"
        - "Whether community features (intentionally fail-closed stub) count as 'existing features' needing completion"
        - "How to sequence Phase-3 fixes on ProtectionSetupScreen without conflicting with the active android-setup-activation-recovery board"

  - id: T002
    type: scout
    assignee: Scout
    status: done
    reasoning_hint: default
    objective: "Map verification and tooling truth: exact typecheck/lint/test/build/run commands for iOS, Android, and web; which test runner exists and whether it supports fake/frozen clocks and timezone override (needed by D3); where persisted app state is read/written and whether any test harness can drive the store layer headlessly; emulator/simulator and adb availability on this machine; Firebase/Supabase local dev setup; design-system and animation conventions in design/; which checks are currently green/red."
    inputs:
      - package.json
      - scripts/
      - eas.json
      - app.config.js
      - tests/
      - design/
      - firebase.json
      - android/
      - ios/
      - modules/
    constraints:
      - "Read-only. Do not edit implementation files."
      - "Run only safe read-only checks (e.g. tsc --noEmit, lint, unit tests); no builds that mutate state or require credentials."
      - "Record commands that were actually run and their results; do not assume."
    expected_output:
      - "Verified command list per platform with pass/fail status"
      - "How to run the app on iOS/Android/web"
      - "Design-system + motion conventions reference"
      - "Known red checks and their meaning"
      - "Frozen-clock and timezone-override test capability: runner, exact API, and an example command that actually ran"
      - "Device reachability reality: adb devices output, emulator availability, xcrun simctl and xcodebuild availability"
      - "Whether a headless harness can drive the persisted-store layer, and how"
    receipt:
      result: done
      harness: claude-code
      note: notes/T002-verification-tooling.md
      summary: "Verification baseline is green and measured, not assumed: npm run typecheck exit=0; all 10 enumerated test suites PASS (test:core, test:firebase-foundation, test:firebase-functions, test:firebase-migration, test:firebase-config, test:firebase-repository, test:firebase-native, test:firebase-runtime, test:firebase-privacy, test:firebase-email-links); npm run audit:runtime-data 12 PASS 0 FAIL. There is no jest/vitest: suites are plain node:assert files run by esbuild via 'node -- scripts/run-ts-entry.js tests/X.test.ts', so frozen-time tests must pass time as an argument rather than mock timers - and recovery-state.ts already accepts 'day: Date | string = new Date()' on nearly every derivation, with TZ= env forwarded to the child node process, so midnight/DST/timezone tests are possible today with no new dependency. Gate gaps found: tests/app-shell.test.ts and tests/design-system.test.ts appear in zero package.json scripts (never gated) and there is no aggregate npm test. The existing audit:runtime-data 'integrity' assurance is source-text string matching (readFileSync + String.includes) and proves nothing about computed values. Device reachability: adb present with no device attached, one bootable AVD (PrimerAuditApi36), iOS 18.2 simulator runtimes installed but all Shutdown, Xcode 26.5 - so emulator/simulator evidence IS obtainable here and 'unproven' is not automatically admissible; only physical-device-only behavior is. Persistence is a single key-value/JSON surface (src/lib/recovery-storage.ts 62 lines + recovery-state.ts normalization), so D6 backcompat tests are written as 'pre-change serialized payload hydrates identically'. freed-app.tsx is now 11002 lines (grew from the 9241 T001 recorded), so Workers must stay single and tightly scoped."
      evidence:
        - docs/goals/feature-audit-completion/notes/T002-verification-tooling.md
        - "src/lib/recovery-state.ts:1274"
        - scripts/run-ts-entry.js
        - scripts/runtime-data-integrity-audit.js
        - src/lib/recovery-storage.ts
        - tests/app-shell.test.ts
        - tests/design-system.test.ts
  - id: T005
    type: scout
    assignee: Scout
    status: done
    reasoning_hint: high
    objective: "Build the per-value DATA-ACCURACY verdict table: for every user-visible derived value (current and best streak, day counters, success and slip counts, totals, usage minutes, timers and countdowns, reset and unlock allowances, level or tier, progress percentages, charted history, reminder and notification schedules, days-installed, last-active) trace the value to its single source of truth, its derivation code path with file and line, and its storage key plus serialized format; then evaluate each rule against midnight crossing, timezone change, DST transition, user clock moved backward, user clock moved forward, app kill, device reboot, reinstall and restore, and a second device on the same account; return a verdict per value of accurate, wrong-for-some-users with repro, or unproven."
    inputs:
      - "T001 note notes/T001-feature-inventory.md"
      - "T002 receipt (test runner and frozen-clock capability)"
      - src/
      - app/
      - store/
      - tests/
    constraints:
      - "Read-only. Do not edit product files; scratch harnesses go in a temp dir, never in the goal root."
      - "Never accept a rendered number as proof: verify persisted state and derivation separately."
      - "Every defect claim needs an exact file and line plus input timestamps with expected versus actual output."
      - "A value with no test coverage is unproven, never accurate."
      - "Report every place the same value is derived more than once and whether the copies can disagree."
      - "State which clock each value trusts: wall clock, monotonic uptime, or persisted anchor."
    expected_output:
      - "Per-value table: value, source of truth, derivation location, storage key and format, clock trust model, tested or untested, verdict, repro"
      - "Duplicate or conflicting derivations of the same value"
      - "Storage schema inventory with versioning and migration status"
      - "Ranked accuracy defects, wrong-for-some-users first, with repro steps"
      - "Candidate Worker slices"
    receipt:
      result: done
      harness: claude-code
      note: notes/T005-data-accuracy.md
      summary: "Per-value accuracy table produced with executed frozen-time probes against the real modules (TZ matrix: America/New_York, Europe/London, Australia/Sydney vs Asia/Kolkata and UTC controls). ROOT CAUSE: three sites convert local wall-clock days using a fixed 86,400,000 ms day (recovery-state.ts:1283 Math.floor, recovery-analytics.ts:247 'dayMs += 86_400_000', recovery-analytics.ts:370), while the rest of the repo already uses calendar-correct setDate/date-key math. BROKEN rows, all measured not inferred: streakDays shows 99 instead of 100 in New York and London and 57 instead of 58 in Sydney across its own 2026-10-04 transition (Kolkata/UTC accurate, control 20-day case accurate); bestStreakDays latches the wrong value and touchRecoveryState:1970-1978 WRITES IT TO SAVED STATE on every open; XP 1584 vs 1600; level progress 0.6914 vs 0.7143; at a true 30-day milestone the app shows 29 with '1 day until the next streak celebration' so the celebration never fires on the earned day; the same word 'streak' renders two different numbers (getPledgeStreakDays 100 vs calculateStreakDaysFrom 99); the streak-history chart emits 6 unique labels for a 7-day range because dateKeysForRange duplicates the fall-back day (US 2026-11-01, Sydney 2026-10-04); and a backwards device clock zeroes the headline streak in every timezone, DST-independent. ACCURATE rows (executed): unlock grant length and active-window boundary across the 23-hour day, session duration seconds, foreground-minute rounding, attempts-on-short-day counts, weekly report totals over the transition, and dayDifference which survives because it rounds. Also found: the green audit:runtime-data 12/12 is source-string matching and never exercised any of this. Three probe rows initially reported WRONG due to my own fixture bugs (missing seconds arg, month-index error, non-blocking sample URLs) and were re-run and re-recorded as accurate, so the accurate rows are real passes. Spawned T008 to fix the class, freeze the harness permanently, and sweep the remaining value classes (urge-risk forecast window, retention anniversary/days-installed, accountability lastSeen, notification snooze, daily unlock allowance, membership receipt age) plus the two rows still code-path-only (daysSinceLastRelapse, 7-day check-in window)."
      evidence:
        - docs/goals/feature-audit-completion/notes/T005-data-accuracy.md
        - "src/lib/recovery-state.ts:1274"
        - "src/lib/recovery-state.ts:1970"
        - "src/lib/recovery-analytics.ts:241"
        - "src/lib/recovery-analytics.ts:469"
        - "src/features/freed-app.tsx:4379"
      spawned_tasks:
        - T008
  - id: T006
    type: scout
    assignee: Scout
    status: done
    reasoning_hint: high
    objective: "Build the NATIVE-CAPABILITY requirement matrix and the per-platform verdict list: for every feature name the native capability it needs (Android usage-stats, private DNS, VPN or filter, overlay, notification listener, foreground service, exact alarms, boot receiver, battery optimization; iOS Device Activity and Screen Time, content blocker, shared extension, notifications and focus, local network, keychain, biometric, background modes), its minimum OS version, its grant flow, and its degradation path when denied or unavailable; then give every feature an Android verdict and an iOS verdict of working, broken, degraded, or unproven, and record what this machine can actually prove via adb, emulator, and simulator."
    inputs:
      - modules/
      - android/
      - ios/
      - app.config.js
      - app.json
      - "AndroidManifest.xml, Info.plist and entitlements files"
      - "T002 receipt (device reachability)"
    constraints:
      - "Read-only. Do not edit product files."
      - "Prove each requirement against the manifest, plist, entitlement, or module source that declares it; cite paths."
      - "Separate four states: code absent, code present but permission not granted, blocked by platform policy, unverified for lack of a device."
      - "Run and record real output of adb devices, emulator -avd list, xcrun simctl list, xcodebuild -version where available."
      - "Never infer iOS behavior from Android code or the reverse."
    expected_output:
      - "Capability matrix: feature, capability, OS floor, grant flow, denial degradation path, file evidence"
      - "Per-platform verdict list: Android verdict and iOS verdict for every feature"
      - "Device-reachability report: provable here versus not provable here"
      - "Platform-policy-impossible list needing a product decision rather than a code fix"
      - "Candidate blocked tasks each naming the exact missing requirement"
    receipt:
      result: done
      note: notes/T006-native-capability-matrix.md
      summary: "Built the native-capability matrix from the real declarations (both AndroidManifests, 2014 lines of Kotlin in modules/freed-protection/android, 1933 lines of FreedProtectionModule.swift, all five iOS extension Info.plist + entitlement pairs, pbxproj target list, android/build.gradle + app/build.gradle, and the TS bridge layer). Confirmed iOS enforcement is genuinely OS-level (FamilyControls + ManagedSettings store + DeviceActivityCenter schedules + shield-configuration/shield-action/Safari-content-blocker/Safari-web-extension/deviceactivity-monitor extensions, all four carrying com.apple.developer.family-controls, iOS 15.1 pin) and Android has a real usage-stats grant activity, accessibility-reactive Focus Shield, DNS-only VPN with specialUse FGS and boot receivers. Verdicts: 6 broken/degraded findings. G1 BROKEN: the Safari Focus Shield handoff Universal Link host intervention.freed.app is NXDOMAIN (curl 000, host NXDOMAIN, independent Google DNS Status 3 with freed.app SOA so the parent is registered) while ios-safari-focus-shield-contract.js and build-ios-release-archive.js REQUIRE it, and no Android autoVerify filter exists for that host - a blocked user has no route into the recovery challenge; control measurement freed-7d5ee.firebaseapp.com AASA returned 200 in the same minute. G2: no explicit OS floor anywhere (Android inherits rootProject.ext.minSdkVersion, app.json declares no deploymentTarget). G3: D7 unmet - 0 TODO(AD-SDK) markers in the whole repo despite the AdMob test-app-id fallback wiring being correct. G4: reminders use an inexact DAILY trigger with no SCHEDULE_EXACT_ALARM/USE_EXACT_ALARM declaration so Android 12+ reminders can drift. G5: Android blocking is accessibility-reactive semi-enforcement, not OS-level. G6: aps-environment is 'development' so push cannot work on TestFlight/App Store builds, and no .storekit config exists for the three hardcoded premium product ids. Recorded the device-availability receipt that makes the only admissible unproven verdict honest: no device attached, one API-36 AVD (PrimerAuditApi36) and iPhone 16 Pro sims available, Xcode 26.5 - so Android rows and iOS app-level rows are provable here, while Family Controls shield enforcement is simulator-impossible and needs an Apple-approved entitlement plus a physical device."
      evidence:
        - notes/T006-native-capability-matrix.md
        - android/app/src/main/AndroidManifest.xml
        - modules/freed-protection/android/src/main/AndroidManifest.xml
        - modules/freed-protection/ios/FreedProtectionModule.swift
        - ios/FREED/FREED.entitlements
        - scripts/lib/ios-safari-focus-shield-contract.js
        - src/lib/recovery-reminders.ts
        - src/lib/purchase-verification.ts
        - android/build.gradle
    spawned_tasks:
      - T009
    ambiguities_for_judge:
      - "G1 has two halves: the DNS/AASA publish is an owner action no repo file can fix, while the Android autoVerify filter for the same host is repo work. Should that in-repo half be its own Worker slice now, or wait until the host resolves?"
      - "D7 marker contract: should TODO(AD-SDK) placement be enforced by a script gate (risking release-readiness churn) or audited per slice by the Judge?"
      - "G2: is pinning expo.ios.deploymentTarget / android.minSdkVersion desirable, or is the pbxproj + Expo default an accepted single source that should only be documented?"


  - id: T007
    type: scout
    assignee: Scout
    status: done
    reasoning_hint: high
    objective: "Walk the app AS A USER on the most reachable runtime and record observed behavior for every feature and flow: cold start, onboarding, paywall, activation and permission setup, the daily main loop, day rollover and streak behavior under a simulated clock change, reset and unlock paths, settings, notifications and reminders, offline, backgrounding and resume, and each surface's empty, loading, error, and success states; for each record what the user sees, what number they see, what that number should have been, and whether the flow dead-ends, loops, silently no-ops, or loses state, calling out Android-only and iOS-only divergences."
    inputs:
      - "T001 note (feature inventory)"
      - "T002 receipt (how to run the app, which harness exists)"
      - "T005 receipt (per-value expectations to check against)"
      - "T006 receipt (per-platform verdicts to confirm or refute)"
    constraints:
      - "Do not edit product files; observation and instrumentation output only."
      - "Prefer observed evidence over inference: record the command run and its actual output per claim."
      - "Simulate day rollover and clock change where the harness allows; record before and after values."
      - "No explicit adult content in evidence: sanitized host-level proof only."
      - "If a runtime is unreachable, record exactly what blocked it instead of substituting a guess."
    expected_output:
      - "User-end behavior log per feature: screen, action, observed result, expected result"
      - "Observed-vs-expected value table cross-checked against T005"
      - "Dead-end, loop, silent no-op, and state-loss findings ranked by user harm"
      - "Android versus iOS observed divergences"
      - "Candidate Worker slices with the file each fix belongs in"
    receipt:
      result: done
      harness: cdp-headless-chrome
      note: notes/T007-user-end-behavior.md
