      summary: "Mapped the Android post-paywall setup path. The app already computes the first missing required step, routes out-of-order taps back to it, refreshes on AppState return, syncs selected Android packages on return, and runs native activation diagnostics before activation can complete. The failure point is the default UI: it renders every permission row, separate DNS/app/test/disclosure cards, route hints, counters, long policy copy, and two bottom CTAs, so the single next action is buried. No new native permission API is needed for the first recovery slice."
      findings:
        - "Post-paywall routes to protectionSetup after paywall; handleSetupContinue blocks entry until activationComplete."
        - "Android required order is reviewed feed sync, DNS Guard/VPN consent, Usage Access, Accessibility, selected app packages, then activation test."
        - "FreedProtectionModule exposes VPN consent/DNS Guard, exact/fallback Accessibility and Usage Access settings routes, app package sync, adult feed sync, and runActivationDiagnostics."
        - "Debug-device proof should use /Users/soumyadebnath16/Library/Android/sdk/platform-tools/adb because adb is not on PATH."
        - "No debug APK was present under android/app/build/outputs/apk/debug; stale release APK exists under android/app/build/outputs/apk/release/app-release.apk."
      evidence:
        - "src/features/freed-app.tsx"
        - "src/lib/protection-permissions.ts"
        - "src/lib/protection-readiness.ts"
        - "modules/freed-protection/src/index.ts"
        - "modules/freed-protection/android/src/main/java/app/freed/protection/FreedProtectionModule.kt"
        - "package.json"
      candidate_worker_files:
