version: 2

goal:
  title: "Android Post-Paywall Protection Recovery"
  slug: "android-setup-activation-recovery"
  kind: recovery
  tranche: "Recover the Android post-paywall setup and activation path on a USB-debugging physical device, then audit post-activation engagement screens."
  status: active
  oracle:
    signal: "Physical Android walkthrough proves paywall-to-activation setup works through a one-step wizard, OS permission routing/return refresh works, Test Protection passes, real adult-domain/search host attempts are blocked or challenged, and normal browsing remains allowed."
    cadence: "after each Worker package and at final audit"
    final_proof: "Sanitized host-level Android physical-device evidence plus local checks mapped to task receipts, with no explicit-content screenshots or raw browsing history."
  intake:
    original_request: "Fix the broken/cluttered Android post-paywall real-permission setup and prove actual blocking works on a USB-debugging device."
    interpreted_outcome: "A normal Android user can pass paywall, enable protection through a simple one-step setup flow, and get working adult-content blocking without diagnostic clutter."
    input_shape: recovery
    audience: "Android users after the FREED paywall"
    authority: approved
    proof_type: demo
    completion_proof: "Physical-device walkthrough with sanitized host-level blocking proof, normal-browsing allow proof, and final audit receipt."
    likely_misfire: "Improving copy or visual layout without proving permission routing and real blocking on a physical Android device."
    blind_spots_considered:
      - "Release APK/AAB remains separate because current local release builds hit CMake exit 137."
      - "Adult-content proof must be host-level and sanitized, not explicit media capture."
      - "Post-activation engagement screens should be audited only after setup activation is proven."
    existing_plan_facts:
      - "Use a one-step wizard instead of a scrolling diagnostics page."
      - "Use debug-device builds for the first proof loop."
      - "Open exact Android OS permission/consent surfaces, refresh on return, and auto-advance."
      - "Hide diagnostics, policy text, counters, and route details behind Advanced/Details."
      - "Use host-level adult-domain/search proof and normal-browsing allow proof."
      - "Audit engagement screens after successful activation and queue only high-impact fixes."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

visual_board:
  selected: local
  local:
    status: live
    url: "http://goalbuddy.localhost:41737/android-setup-activation-recovery/"
    command: "npx goalbuddy board docs/goals/android-setup-activation-recovery"

