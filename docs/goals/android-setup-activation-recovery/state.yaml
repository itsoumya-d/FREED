      - "Existing validation and release-status artifacts"
    constraints:
      - "Read-only."
      - "Do not edit implementation files."
      - "Prefer concrete file paths, symbols, commands, and observed device/build state over generic UX advice."
      - "Do not capture explicit adult content or raw private browsing data."
    expected_output:
      - "Current post-paywall setup flow map"
      - "Exact reasons Continue or permission actions fail, if discoverable"
      - "Available native permission/status APIs and missing APIs"
      - "Debug-device build/install command list"
      - "Candidate safe implementation files for one-step wizard"
    receipt:
