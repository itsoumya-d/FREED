// Top-level build file where you can add configuration options common to all sub-projects/modules.

def freedReadRootPropertyOrEnv = { propertyName, envName ->
  def propertyValue = findProperty(propertyName)
  if (propertyValue != null && propertyValue.toString().trim()) {
    return propertyValue.toString().trim()
  }

  def envValue = System.getenv(envName)
  return envValue != null && envValue.trim() ? envValue.trim() : null
}

def freedGoogleMobileAdsLocalTestAppId = "ca-app-pub-3940256099942544~3347511713"
def freedGoogleMobileAdsAndroidAppId = freedReadRootPropertyOrEnv(
  "freed.googleMobileAds.androidAppId",
  "EXPO_PUBLIC_ADMOB_APP_ID_ANDROID"
) ?: freedReadRootPropertyOrEnv(
  "freed.googleMobileAds.appId",
  "EXPO_PUBLIC_ADMOB_APP_ID"
) ?: freedGoogleMobileAdsLocalTestAppId

ext.freedGoogleMobileAdsAndroidAppId = freedGoogleMobileAdsAndroidAppId
ext.freedGoogleMobileAdsUsesLocalTestAppId = freedGoogleMobileAdsAndroidAppId == freedGoogleMobileAdsLocalTestAppId
ext.googleMobileAdsJson = [
  getStringValue: { key, defaultValue ->
    key == "android_app_id" ? rootProject.ext.freedGoogleMobileAdsAndroidAppId : defaultValue
  },
  isFlagEnabled: { key, defaultValue ->
    if (key == "delay_app_measurement_init") return true
    if (key == "optimize_initialization") return true
    if (key == "optimize_ad_loading") return true
    return defaultValue
  }
]

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
    classpath('com.google.gms:google-services:4.4.4')
    classpath('com.google.firebase:firebase-crashlytics-gradle:3.0.7')
    classpath('com.google.firebase:perf-plugin:2.0.2')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

subprojects { subproject ->
  subproject.afterEvaluate {
    if (subproject.name == "react-native-google-mobile-ads") {
      def androidExtension = subproject.extensions.findByName("android")
      if (androidExtension != null) {
        androidExtension.defaultConfig.manifestPlaceholders.putAll([
          appJSONGoogleMobileAdsAppID                  : rootProject.ext.freedGoogleMobileAdsAndroidAppId,
          appJSONGoogleMobileAdsDelayAppMeasurementInit: true,
          appJSONGoogleMobileAdsOptimizeInitialization : true,
          appJSONGoogleMobileAdsOptimizeAdLoading      : true
        ])
      }
    }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
