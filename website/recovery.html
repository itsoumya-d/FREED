<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow">
  <meta name="color-scheme" content="light dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'self'; script-src 'self'; connect-src 'none'; form-action 'none'; base-uri 'none'">
  <title>A moment with FREED</title>
  <link rel="stylesheet" href="/assets/recovery.css">
  <script src="/assets/recovery.js" defer></script>
</head>
<body>
  <main>
    <header><span class="brand">FREED</span><label class="language"><span id="language-label">Language</span><select id="language" aria-labelledby="language-label"><option value="en">English</option><option value="hi">हिन्दी</option><option value="es">Español</option><option value="pt">Português</option><option value="fr">Français</option><option value="de">Deutsch</option><option value="ar">العربية</option><option value="ja">日本語</option><option value="ko">한국어</option><option value="zh-Hans">简体中文</option></select></label></header>
    <div class="art" aria-hidden="true"><img src="/assets/recovery-kite.png" width="240" height="240" alt=""></div>
    <h1 id="heading">Take a moment.</h1>
    <p id="intro" class="intro">Choose a useful reset in FREED.</p>
    <div class="actions">
      <!-- Keep the existing installed-app route until signed HTTPS association checks pass. -->
      <a id="open-challenge" class="primary" href="freed://guided-reset" data-app-link="https://freed-7d5ee.firebaseapp.com/intervention" rel="noreferrer">Open Challenge</a>
      <a id="open-installed" class="fallback" href="freed://guided-reset" rel="noreferrer" hidden>Open installed app</a>
      <a id="safe-exit" class="exit" href="https://www.google.com/" rel="noreferrer">Leave for now</a>
    </div>
    <p id="status" class="status" role="status" aria-live="polite"></p>
    <footer><p id="protection">A reset never turns off website protection.</p><a id="help" href="/support" rel="noreferrer">Need help?</a></footer>
  </main>
</body>
</html>
